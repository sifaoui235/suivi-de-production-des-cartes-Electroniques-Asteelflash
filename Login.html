<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="style.css" rel="stylesheet">
</head>
<body class="login-page">
<img src="image.png" alt="" class="background-image">
<div class="card">
    <div class="left">
        <h2>Suivi de production des cartes</h2>
        <p>Suivez l'avancement de la production des cartes et consultez en temps réel les différentes étapes de fabrication.</p>
    </div>

    <div class="right">
        <div class="brand">
            <img src="logo.png" alt="Logo">
        </div>
        <h1>Welcome !</h1>

        <form id="login-form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required>

            <p class="auth-error" id="login-error"></p>

            <input type="submit" value="Login" class="loginn">

            <a href="visitor.html" class="visitor-link"><b>Are you just a visitor ? </b></a>
        </form>
    </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
